<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UniFi PoE Manager</title>
  <link rel="icon" href="/static/favicon-32.png" sizes="32x32">
  <link rel="icon" href="/static/favicon-16.png" sizes="16x16">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#1c2430">
  <script src="/static/htmx.min.js"></script>
  <script src="/static/json-enc.js"></script>
  <style>
    :root { color-scheme: light dark; font-size: 120%; }
    body {
      font-family: system-ui, sans-serif;
      max-width: 32rem;
      margin: 0 auto;
      padding: 1rem;
    }
    h1 { font-size: 1.25rem; }
    .scope.site {
      margin: 1rem 0;
      padding: 0.75rem;
      border: 1px solid currentColor;
      border-radius: 0.5rem;
    }
    .ports-toggle { margin-top: 1rem; }
    .ports-toggle > summary { cursor: pointer; font-weight: bold; }
    .ports-toggle > summary::marker { font-size: 0.8em; }
    .ports-toggle > hr {
      border: none;
      border-top: 1px solid currentColor;
      opacity: 0.3;
      margin: 0.75rem 0;
    }
    .ports-toggle ul.ports { margin-top: 0.75rem; }
    ul.ports { list-style: none; padding: 0; margin: 0; }
    .port-row {
      padding: 0.75rem 0 0;
      border-top: 1px solid currentColor;
    }
    .port-row:first-child { border-top: none; padding-top: 0; }
    .port-row:not(:last-child) { padding-bottom: 0.75rem; }
    .summary-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .scope-name { font-weight: bold; }
    .next-state {
      margin-left: auto;
      text-align: right;
      font-size: 0.85rem;
    }
    .port-sub { display: block; font-size: 0.75rem; opacity: 0.6; margin-bottom: 0.5rem; }
    .state-dot {
      width: 0.6rem;
      height: 0.6rem;
      flex: none;
    }
    .state-dot.on { border-radius: 50%; background: #2e8b57; }
    .state-dot.off { border-radius: 0; background: #888; }
    .time-remaining { opacity: 0.6; font-size: 0.85em; }
    .scope-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }
    button {
      font-size: 1rem;
      padding: 0.6rem 1rem;
      border-radius: 0.4rem;
      border: 1px solid currentColor;
      background: transparent;
      color: inherit;
    }
    button.primary { font-weight: bold; }
    button.danger {
      background: #c0392b;
      border-color: #c0392b;
      color: #fff;
    }
    .duration-row {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .duration-label { font-size: 0.8rem; opacity: 0.7; }
    button.pill {
      font-size: 0.85rem;
      padding: 0.4rem 0.7rem;
    }
    button.link {
      border: none;
      padding: 0.2rem 0;
      font-size: 0.8rem;
      text-decoration: underline;
      opacity: 0.7;
      flex-basis: 100%;
      text-align: left;
    }
  </style>
</head>
<body>
  <h1>UniFi PoE Manager</h1>
  {% include "_status.html" %}
  <script>
    // #status is fully replaced (outerHTML) on every action and on every
    // 60s poll, which would otherwise silently re-collapse the "Ports"
    // disclosure whenever a viewer had manually opened it. Preserve just
    // that one bit of UI state across swaps.
    (function () {
      var portsOpen = null;
      document.body.addEventListener("htmx:beforeSwap", function () {
        var toggle = document.querySelector("#status .ports-toggle");
        portsOpen = toggle ? toggle.open : null;
      });
      document.body.addEventListener("htmx:afterSwap", function () {
        if (portsOpen === null) return;
        var toggle = document.querySelector("#status .ports-toggle");
        if (toggle) toggle.open = portsOpen;
      });
    })();
  </script>
</body>
</html>
