[project]
name = "unifi-poe-manager"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiohttp",
    "aiounifi",
    "apscheduler",
    "sqlalchemy",
    "python-dotenv",
    "fastapi",
    "uvicorn",
    "jinja2",
]

[project.scripts]
unifi-poe-manager = "unifi_poe_manager.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unifi_poe_manager = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
